name: StarFall release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: starfall-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check required secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          for v in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD GOOGLE_SERVICES_JSON_B64; do
            [ -n "${!v}" ] || { echo "::error::Missing repository secret $v"; exit 1; }
          done

      - name: Restore config and signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          mkdir -p app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json

      - name: Build signed release APK (Google Play flavor)
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --console=plain assembleGmsRelease --warning-mode summary

      - name: Rename APK and print its signing fingerprint
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk/gms/release -name "*.apk" | head -1)
          [ -n "$APK" ] || { echo "::error::No APK produced"; exit 1; }
          cp "$APK" dist/StarFall.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs dist/StarFall.apk | grep -E "SHA-1|SHA-256"

      - uses: actions/upload-artifact@v4
        with:
          name: StarFall
          path: dist/StarFall.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; else
            VER=$(grep -m1 -oP '^\s*versionName\s*=\s*"\K[^"]+' app/build.gradle.kts); TAG="v${VER}"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/StarFall.apk --clobber
          else
            gh release create "$TAG" dist/StarFall.apk --title "StarFall $TAG" --generate-notes --target "${GITHUB_SHA}"
          fi
